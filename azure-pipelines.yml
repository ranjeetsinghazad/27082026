trigger:
- main
# - features/*

pool: new5

#variables: 
  #service_connection: 'service_connection5'
#  source_workdirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

stages:
  - stage: 
    jobs:
      - job: 
        steps:
        # TerraformInstaller task removed to prevent ENOENT error
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'service_connection5'
            backendAzureRmResourceGroupName: 'rg5'
            backendAzureRmStorageAccountName: 'stg984'
            backendAzureRmContainerName: 'container5'
            backendAzureRmKey: 'ranjeet.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'

  - stage: 
    jobs:
      - job: 
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            backendServiceArm: 'service_connection5'
            backendAzureRmResourceGroupName: 'rg5'
            backendAzureRmStorageAccountName: 'stg984'
            backendAzureRmContainerName: 'container5'
            backendAzureRmKey: 'ranjeet.tfstate'
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
            environmentServiceNameAzureRM: 'service_connection5'
            commandOptions: '-auto-approve' # Added to prevent the pipeline from hanging